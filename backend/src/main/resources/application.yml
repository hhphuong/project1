server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: project-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Dùng none để Hibernate không tự sửa 8 bảng đã tạo từ SQL.
      # Sau khi xóa module mẫu Product và tạo đủ 8 Entity thật, đổi thành validate.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:attendance-system-local-jwt-secret-key-at-least-32-chars-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}